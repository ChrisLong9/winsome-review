document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const msg=document.getElementById('msg'),go=document.getElementById('go');
  if(!(window.crypto&&crypto.subtle)){msg.textContent='This browser cannot open the preview. Try Chrome or Edge.';return;}
  go.disabled=true;msg.textContent='Opening…';
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.i)},key,u(P.d));
    const html=new TextDecoder().decode(plain);
    document.open();document.write(html);document.close();
  }catch(err){go.disabled=false;msg.textContent='That password did not work. Check it and try again.';}
});
